<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Local Poker</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --felt: #14382b;
        --felt-deep: #0d271e;
        --rail: #2a1a12;
        --cream: #efe7d3;
        --cream-dim: #b9b09a;
        --gold: #d9a441;
        --chip-red: #c94f3d;
        --chip-blue: #3d7dc9;
        --chip-green: #4f9e6b;
        --card: #1b4536;
        --line: #2c5a48;
        --danger: #c94f3d;
        --r: 10px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: "Archivo", system-ui, sans-serif;
        background: radial-gradient(120% 90% at 50% 0%, var(--felt) 0%, var(--felt-deep) 78%);
        color: var(--cream);
        font-size: 16px;
        line-height: 1.45;
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      }
      button {
        font: inherit;
        border: 0;
        border-radius: var(--r);
        cursor: pointer;
        color: var(--cream);
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      input,
      select {
        font: inherit;
        color: var(--cream);
        background: var(--felt-deep);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 10px 12px;
        width: 100%;
      }
      .screen {
        max-width: 520px;
        margin: 0 auto;
        padding: 20px 16px 120px;
        display: none;
      }
      .screen.on {
        display: block;
      }
      .wordmark {
        font-weight: 800;
        font-variation-settings: "wdth" 78;
        letter-spacing: -0.02em;
        font-size: 34px;
      }
      .wordmark em {
        font-style: normal;
        color: var(--gold);
      }
      .sub {
        color: var(--cream-dim);
        margin: 4px 0 26px;
      }
      .stack-v > * + * {
        margin-top: 12px;
      }
      .field label {
        display: block;
        font-size: 14px;
        color: var(--cream-dim);
        margin-bottom: 5px;
      }
      .row {
        display: flex;
        gap: 10px;
      }
      .row > * {
        flex: 1;
      }
      .btn {
        padding: 14px 16px;
        font-weight: 700;
        background: var(--card);
        border: 1px solid var(--line);
        width: 100%;
      }
      .btn.gold {
        background: var(--gold);
        color: #2a1f08;
        border-color: var(--gold);
      }
      .btn.red {
        background: var(--chip-red);
        border-color: var(--chip-red);
      }
      .btn.ghost {
        background: transparent;
      }
      .toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 12px;
      }
      .toggle input {
        width: auto;
        accent-color: var(--gold);
        transform: scale(1.35);
      }
      hr.split {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 24px 0;
      }
      .notice {
        background: var(--card);
        border: 1px solid var(--line);
        border-left: 4px solid var(--gold);
        border-radius: var(--r);
        padding: 10px 12px;
        font-size: 15px;
        margin-bottom: 12px;
      }
      .err {
        border-left-color: var(--danger);
      }

      /* table */
      .topbar {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .roomcode {
        font-weight: 800;
        letter-spacing: 0.14em;
        font-size: 18px;
        color: var(--gold);
      }
      .roomcode small {
        color: var(--cream-dim);
        letter-spacing: 0;
        font-weight: 400;
        margin-right: 6px;
      }
      .handline {
        color: var(--cream-dim);
        font-size: 14px;
      }
      /* ---- the table ---- */
      .feltwrap {
        position: relative;
        width: 100%;
        aspect-ratio: 0.95;
        margin: 6px 0 10px;
      }
      .felt {
        position: absolute;
        inset: 13% 9%;
        border-radius: 48% / 44%;
        background: radial-gradient(80% 90% at 50% 30%, #1d4c3b 0%, var(--felt-deep) 88%);
        border: 7px solid var(--rail);
        box-shadow:
          inset 0 0 34px rgba(0, 0, 0, 0.45),
          0 4px 18px rgba(0, 0, 0, 0.35);
      }
      .felt-center {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        width: 56%;
        pointer-events: none;
      }
      .felt-center .n {
        font-size: 34px;
        font-weight: 800;
        line-height: 1;
        font-variation-settings: "wdth" 82;
      }
      .felt-center .l {
        color: var(--cream-dim);
        font-size: 12px;
        margin-top: 2px;
      }
      .felt-center .street {
        color: var(--gold);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-top: 3px;
      }
      .pseat {
        position: absolute;
        transform: translate(-50%, -50%);
        width: 96px;
        text-align: center;
        z-index: 2;
      }
      .pseat.tappable {
        cursor: pointer;
      }
      .pseat .avatar {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        margin: 0 auto 3px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 17px;
        background: var(--card);
        border: 2px solid var(--line);
        transition: box-shadow 0.2s;
      }
      .pseat.turn .avatar {
        border-color: var(--gold);
        box-shadow: 0 0 12px rgba(217, 164, 65, 0.6);
      }
      .pseat.folded {
        opacity: 0.45;
      }
      .pseat.away .avatar {
        border-style: dashed;
        opacity: 0.7;
      }
      .pseat .plate {
        display: inline-block;
        background: var(--felt-deep);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 2px 7px;
        font-size: 12px;
        line-height: 1.3;
        max-width: 96px;
      }
      .plate .nm {
        font-weight: 700;
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .plate .st {
        font-weight: 800;
        font-size: 13px;
      }
      .pseat .tag {
        font-size: 10px;
        font-weight: 800;
        border-radius: 99px;
        padding: 1px 6px;
        display: inline-block;
        margin-top: 2px;
      }
      .tag.allin {
        background: var(--chip-red);
      }
      .tag.out {
        background: var(--felt-deep);
        color: var(--cream-dim);
        border: 1px solid var(--line);
      }
      .tag.pend {
        background: var(--chip-green);
      }
      .betchip {
        position: absolute;
        transform: translate(-50%, -50%);
        z-index: 1;
        background: rgba(13, 39, 30, 0.9);
        border: 1px solid var(--gold);
        color: var(--gold);
        font-weight: 700;
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 99px;
      }
      .dbtn {
        position: absolute;
        transform: translate(-50%, -50%);
        z-index: 1;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--cream);
        color: #222;
        font-size: 11px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .btn.armed,
      .mini.armed {
        background: var(--gold);
        color: #2a1f08;
        border-color: var(--gold);
      }
      .ticker {
        margin: 14px 0;
        font-size: 14px;
        color: var(--cream-dim);
        max-height: 126px;
        overflow-y: auto;
        border-left: 2px solid var(--line);
        padding-left: 10px;
      }
      .ticker b {
        color: var(--cream);
      }
      .ticker .amt {
        color: var(--gold);
      }

      /* action bar */
      .actionbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--rail);
        border-top: 2px solid var(--gold);
        padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      }
      .actionbar .inner {
        max-width: 520px;
        margin: 0 auto;
      }
      .acts {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
      }
      .acts .btn {
        padding: 14px 6px;
        font-size: 16px;
      }
      .raise-row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .raise-row input[type="number"] {
        flex: 1;
        text-align: center;
        font-weight: 700;
        font-size: 18px;
      }
      .raise-row .btn {
        flex: 1.4;
      }
      .waiting {
        color: var(--cream-dim);
        text-align: center;
        font-size: 15px;
      }

      /* showdown */
      .potcard {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 12px;
        margin-bottom: 10px;
      }
      .potcard h4 {
        font-size: 15px;
        margin-bottom: 6px;
      }
      .potcard h4 span {
        color: var(--gold);
      }
      .rungrid {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      .wpick {
        padding: 8px 12px;
        border-radius: 99px;
        background: var(--felt-deep);
        border: 1px solid var(--line);
        font-size: 14px;
      }
      .wpick.sel {
        background: var(--gold);
        color: #2a1f08;
        border-color: var(--gold);
        font-weight: 700;
      }
      .runlabel {
        font-size: 13px;
        color: var(--cream-dim);
        margin-top: 8px;
      }

      /* host drawer */
      .hostbtn {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top));
        right: 12px;
        z-index: 5;
        background: var(--rail);
        border: 1px solid var(--line);
        padding: 8px 14px;
        font-weight: 700;
      }
      .drawer {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: none;
        z-index: 10;
      }
      .drawer.on {
        display: block;
      }
      .drawer .panel {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: min(92vw, 380px);
        background: var(--felt-deep);
        border-left: 1px solid var(--line);
        padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
        overflow-y: auto;
      }
      .panel h3 {
        margin-bottom: 12px;
      }
      .hrow {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
        font-size: 15px;
      }
      .hrow .grow {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mini {
        padding: 7px 10px;
        font-size: 13px;
        border-radius: 8px;
        background: var(--card);
        border: 1px solid var(--line);
      }
      .mini.red {
        background: var(--chip-red);
        border-color: var(--chip-red);
      }
      .mini.gold {
        background: var(--gold);
        color: #2a1f08;
        border-color: var(--gold);
      }
      .dim {
        color: var(--cream-dim);
        font-size: 13px;
      }
      @media (prefers-reduced-motion: reduce) {
        .pseat .avatar {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- ============ HOME ============ -->
    <section id="s-home" class="screen on">
      <div class="wordmark">Local <em>Poker</em></div>
      <p class="sub">Chips and pots for a live game — the cards stay on the table.</p>
      <div id="home-err"></div>
      <div class="stack-v">
        <div class="field">
          <label for="j-code">Join a table</label>
          <div class="row">
            <input
              id="j-code"
              placeholder="Room code"
              autocapitalize="characters"
              maxlength="5"
              style="letter-spacing: 0.2em; font-weight: 700"
            />
            <button class="btn gold" style="flex: 0.7" onclick="joinFromHome()">Join</button>
          </div>
        </div>
        <div class="field">
          <label for="j-name">Your name</label>
          <input id="j-name" placeholder="Name" maxlength="20" />
        </div>
        <div class="field">
          <label for="j-buy">Your buy-in (the host approves it)</label>
          <input id="j-buy" type="number" inputmode="numeric" min="1" placeholder="e.g. 200" />
        </div>
      </div>
      <hr class="split" />
      <div class="stack-v">
        <div class="row">
          <div class="field">
            <label for="c-sb">Small blind</label><input id="c-sb" type="number" value="1" min="1" />
          </div>
          <div class="field">
            <label for="c-bb">Big blind</label><input id="c-bb" type="number" value="2" min="1" />
          </div>
          <div class="field">
            <label for="c-buy">Buy-in</label><input id="c-buy" type="number" value="200" min="1" />
          </div>
        </div>
        <label class="toggle"
          >Allow straddles <input id="c-straddle" type="checkbox" checked
        /></label>
        <label class="toggle"
          >Allow run-it-twice <input id="c-rit" type="checkbox" checked
        /></label>
        <button class="btn" onclick="createGame()">Start a new table</button>
      </div>
    </section>

    <!-- ============ RESTORE ============ -->
    <section id="s-restore" class="screen">
      <div class="wordmark">Local <em>Poker</em></div>
      <p class="sub">The server restarted, but this game was backed up on your phones.</p>
      <div id="restore-body" class="stack-v"></div>
    </section>

    <!-- ============ TABLE ============ -->
    <section id="s-table" class="screen">
      <div class="topbar">
        <div class="roomcode"><small>room</small><span id="t-code"></span></div>
        <div class="handline" id="t-hand"></div>
      </div>
      <div id="t-notice"></div>
      <div class="feltwrap">
        <div class="felt"></div>
        <div class="felt-center">
          <div class="n" id="t-pot">0</div>
          <div class="l" id="t-potlabel">pot</div>
          <div class="street" id="t-street"></div>
        </div>
        <div id="t-seatlayer"></div>
      </div>
      <div class="ticker" id="t-log"></div>
      <div id="t-showdown"></div>
      <div id="t-idle"></div>
    </section>

    <button class="hostbtn" id="hostbtn" style="display: none" onclick="toggleDrawer(true)">
      Host
    </button>
    <div class="drawer" id="drawer" onclick="if (event.target === this) toggleDrawer(false);">
      <div class="panel" id="drawer-panel"></div>
    </div>

    <!-- host: tap a seat to act on that player -->
    <div class="drawer" id="sheet" onclick="if (event.target === this) closeSheet();">
      <div class="panel" id="sheet-panel"></div>
    </div>

    <div class="actionbar" id="actionbar" style="display: none">
      <div class="inner" id="actionbar-inner"></div>
    </div>

    <script>
      "use strict";
      /* ---------------- connection ---------------- */
      let ws = null,
        retryMs = 800,
        room = null,
        S = null,
        YOU = null,
        wanted = null,
        restoreInfo = null;
      const $ = (id) => document.getElementById(id);
      const store = {
        get name() {
          return localStorage.getItem("ts_name") || "";
        },
        set name(v) {
          localStorage.setItem("ts_name", v);
        },
        tok(r) {
          return localStorage.getItem("ts_tok_" + r);
        },
        setTok(r, t) {
          localStorage.setItem("ts_tok_" + r, t);
        },
        clearTok(r) {
          localStorage.removeItem("ts_tok_" + r);
        },
        snap(r) {
          try {
            return JSON.parse(localStorage.getItem("ts_snap_" + r));
          } catch {
            return null;
          }
        },
        setSnap(r, o) {
          try {
            localStorage.setItem("ts_snap_" + r, JSON.stringify(o));
          } catch {}
        },
      };
      function connect() {
        ws = new WebSocket(
          (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws"
        );
        ws.onopen = () => {
          retryMs = 800;
          if (wanted) send(wanted);
        };
        ws.onmessage = (e) => handle(JSON.parse(e.data));
        ws.onclose = () => {
          setTimeout(connect, retryMs);
          retryMs = Math.min(retryMs * 1.7, 8000);
        };
      }
      function send(m) {
        if (ws && ws.readyState === 1) ws.send(JSON.stringify(m));
      }
      setInterval(() => send({ type: "ping" }), 120000); // heartbeat: resets Render's idle timer + liveness
      connect();

      /* wake lock: keep the host phone's screen (and socket) alive during live games */
      async function tryWakeLock() {
        try {
          if (YOU && YOU.isHost && navigator.wakeLock) await navigator.wakeLock.request("screen");
        } catch {}
      }
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          tryWakeLock();
          if (wanted) send(wanted);
        }
      });

      /* ---------------- flows ---------------- */
      function createGame() {
        const name = ($("j-name").value || "").trim();
        if (!name) return homeErr("Enter a name first.");
        store.name = name;
        wanted = null;
        send({
          type: "create",
          name,
          config: {
            smallBlind: +$("c-sb").value || 1,
            bigBlind: +$("c-bb").value || 2,
            defaultBuyIn: +$("c-buy").value || 200,
            straddleAllowed: $("c-straddle").checked,
            ritAllowed: $("c-rit").checked,
          },
        });
      }
      function joinFromHome() {
        const code = ($("j-code").value || "").toUpperCase().trim();
        const name = ($("j-name").value || "").trim();
        const buy = Math.floor(+$("j-buy").value);
        if (code.length < 4) return homeErr("Enter the room code.");
        if (!name) return homeErr("Enter a name.");
        if (store.tok(code)) return joinRoom(code); // you already have a seat — reconnect
        if (!(buy > 0)) return homeErr("Enter your buy-in.");
        store.name = name;
        joinRoom(code, name, buy);
      }
      function joinRoom(code, name, buyIn) {
        room = code;
        wanted = {
          type: "hello",
          room: code,
          token: store.tok(code) || undefined,
          name: name || undefined,
          buyIn: buyIn || undefined,
        };
        send(wanted);
        enterRoomUrl(code);
      }
      /* push /?g=CODE onto history (once) so the back button returns home */
      function enterRoomUrl(code) {
        const cur = new URLSearchParams(location.search).get("g");
        if (cur !== code) history.pushState({ g: code }, "", "/?g=" + code);
      }
      function goHome() {
        wanted = null;
        S = null;
        YOU = null;
        room = null;
        restoreInfo = null;
        toggleDrawer(false);
        closeSheet();
        $("hostbtn").style.display = "none";
        $("actionbar").style.display = "none";
        if (ws && ws.readyState === 1) ws.close(); // detach cleanly; auto-reconnect gives a fresh socket
        showScreen("s-home");
      }
      window.addEventListener("popstate", () => {
        const g = new URLSearchParams(location.search).get("g");
        if (!g) {
          goHome();
          return;
        }
        $("j-code").value = g.toUpperCase();
        joinRoom(g.toUpperCase());
      });
      function homeErr(t) {
        $("home-err").innerHTML = `<div class="notice err">${esc(t)}</div>`;
      }

      /* ---------------- message handling ---------------- */
      function handle(m) {
        switch (m.type) {
          case "pong":
            return;
          case "created":
            room = m.room;
            store.setTok(room, m.token);
            wanted = { type: "hello", room, token: m.token };
            enterRoomUrl(room);
            return;
          case "joined_unseated":
            store.setTok(m.room, m.token);
            wanted = { type: "hello", room: m.room, token: m.token };
            return;
          case "need_name": {
            // stale or missing token — join deliberately from the home screen
            wanted = null;
            store.clearTok(m.room);
            $("j-code").value = m.room;
            showScreen("s-home");
            homeErr(`Enter your name and buy-in to join ${esc(m.room)}.`);
            return;
          }
          case "state":
            onState(m);
            return;
          case "unknown_room":
            onUnknownRoom(m.room);
            return;
          case "room_live":
            if (wanted) send(wanted);
            return;
          case "restore_prompt":
            restoreInfo = m;
            renderRestore();
            return;
          case "error":
            flashError(m.message);
            return;
          case "ended":
            alert("Game ended by the host." + (m.state ? finalStandings(m.state) : ""));
            location.href = "/";
            return;
        }
      }
      function onState(m) {
        if (!wanted) return; // user backed out to home — ignore late broadcasts
        S = m.state;
        YOU = m.you;
        room = S.code;
        if (m.snapshot)
          store.setSnap(room, { snapshot: m.snapshot, savedAt: Date.now(), name: store.name });
        showScreen("s-table");
        renderTable();
        tryWakeLock();
      }
      function onUnknownRoom(code) {
        const saved = store.snap(code);
        if (saved && saved.snapshot) {
          send({
            type: "offer_snapshot",
            room: code,
            snapshot: saved.snapshot,
            savedAt: saved.savedAt,
            fromName: saved.name || store.name || "?",
          });
          showScreen("s-restore");
          $("restore-body").innerHTML =
            `<div class="notice">Backup sent. Waiting for a restore…</div>`;
        } else {
          showScreen("s-restore");
          $("restore-body").innerHTML =
            `<div class="notice">Room <b>${esc(code)}</b> isn't running and this phone has no backup of it.
      If someone else at the table has one, theirs will appear here — otherwise <a href="/" style="color:var(--gold)">start a fresh table</a>.</div>`;
        }
      }
      function renderRestore() {
        const r = restoreInfo;
        if (!r) return;
        showScreen("s-restore");
        const when = new Date(r.savedAt).toLocaleTimeString();
        const streetName =
          ["preflop", "flop", "turn", "river", "showdown"][r.seq.street] || "between hands";
        let html = `<div class="notice">Newest backup: <b>hand ${r.seq.hand}</b>, ${streetName}, ${r.seq.actions} action(s) in —
    saved ${when} on <b>${esc(r.fromName)}</b>'s phone.</div>`;
        if (r.canRestore) {
          html += `<button class="btn gold" onclick='send({type:"restore",room:room})'>
      ${r.youAreHost ? "Restore game (you're the host)" : "Restore game and take over as host"}</button>`;
          if (!r.youAreHost)
            html += `<p class="dim">The original host hasn't returned. Restoring makes you the new host — check with the table first.</p>`;
        } else {
          html += `<p class="dim">Waiting for the host to restore. If they don't return in ${Math.ceil((r.waitMs || 0) / 1000)}s, anyone here can.</p>`;
          setTimeout(
            () => {
              if (restoreInfo) {
                restoreInfo.canRestore = true;
                restoreInfo.waitMs = 0;
                renderRestore();
              }
            },
            (r.waitMs || 0) + 400
          );
        }
        $("restore-body").innerHTML = html;
      }

      /* ---------------- table rendering ---------------- */
      function showScreen(id) {
        document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id));
      }
      function esc(s) {
        return String(s ?? "").replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]
        );
      }
      function flashError(t) {
        $("t-notice").innerHTML = `<div class="notice err">${esc(t)}</div>`;
        setTimeout(() => {
          if (S) renderTable();
        }, 2600);
      }

      function me() {
        return YOU && YOU.seat >= 0 ? S.players.find((p) => p.seat === YOU.seat) : null;
      }

      function renderTable() {
        $("t-code").textContent = S.code;
        $("t-hand").textContent = S.hand ? `hand ${S.hand}` : "no hands yet";
        let noticeHtml = S.notice ? `<div class="notice">${esc(S.notice)}</div>` : "";
        if (YOU && YOU.isHost && S.unseated && S.unseated.length) {
          const who = S.unseated
            .map((u) => {
              return `<b>${esc(u.name)}</b>${u.buyIn > 0 ? ` (${u.buyIn})` : ""}`;
            })
            .join(", ");
          noticeHtml += `<div class="notice">${who} ${S.unseated.length === 1 ? "wants" : "want"} to sit —
            <a href="#" style="color:var(--gold)" onclick="toggleDrawer(true);return false;">seat them in Host controls</a>.</div>`;
        }
        $("t-notice").innerHTML = noticeHtml;
        const inPots = S.pots ? S.pots.reduce((a, p) => a + p.remaining, 0) : 0;
        const front = S.players.reduce((a, p) => a + p.committedStreet, 0);
        $("t-pot").textContent = S.pot + inPots + front || 0;
        $("t-potlabel").textContent = front ? `pot ${S.pot + inPots} + ${front} in front` : "pot";
        $("t-street").textContent =
          S.state === "hand" ? S.street : S.state === "showdown" ? "showdown" : "";
        $("hostbtn").style.display = YOU && YOU.isHost ? "block" : "none";
        if (!(YOU && YOU.isHost)) {
          $("drawer").classList.remove("on");
          if (sheetSeat != null) closeSheet();
        }

        renderFelt();

        // street log (current street + earlier streets this hand)
        const past = Object.entries(S.handLog || {})
          .map(([st, log]) => logLines(st, log))
          .join("");
        $("t-log").innerHTML =
          past + (S.streetLog && S.streetLog.length ? logLines(S.street || "", S.streetLog) : "");
        const tl = $("t-log");
        tl.scrollTop = tl.scrollHeight;

        renderShowdown();
        renderIdle();
        renderActionBar();
        if (YOU && YOU.isHost) {
          renderDrawer();
          renderSheet();
        }
      }

      /* seats laid out around the oval, rotated so you sit bottom-center */
      function initialsOf(name) {
        return String(name || "?")
          .trim()
          .slice(0, 2)
          .toUpperCase();
      }
      function renderFelt() {
        const layer = $("t-seatlayer");
        const ps = [...S.players].sort((a, b) => {
          return a.seat - b.seat;
        });
        const n = ps.length;
        if (!n) {
          layer.innerHTML = "";
          return;
        }
        let hero = ps.findIndex((p) => {
          return YOU && p.seat === YOU.seat;
        });
        if (hero < 0) hero = 0;
        const toAct = S.betting ? S.betting.toActSeat : -1;
        const midHand = S.state !== "idle";
        let html = "";
        ps.forEach((p, i) => {
          const a = Math.PI / 2 + (2 * Math.PI * ((i - hero + n) % n)) / n;
          const x = 50 + 39 * Math.cos(a);
          const y = 50 + 38 * Math.sin(a);
          const sittingOut = midHand && !p.inHand && !p.folded;
          const tags = [];
          if (p.allIn) tags.push('<span class="tag allin">ALL-IN</span>');
          if (p.folded) tags.push('<span class="tag out">folded</span>');
          if (sittingOut) tags.push('<span class="tag out">next hand</span>');
          if (p.pendingChips) {
            tags.push(
              `<span class="tag pend">${p.pendingChips > 0 ? "+" : ""}${p.pendingChips} next</span>`
            );
          }
          const cls = [
            "pseat",
            p.seat === toAct ? "turn" : "",
            p.folded ? "folded" : "",
            p.connected ? "" : "away",
            YOU && YOU.isHost ? "tappable" : "",
          ].join(" ");
          const tap = YOU && YOU.isHost ? `onclick="openSheet(${p.seat})"` : "";
          html += `<div class="${cls}" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%" ${tap}>
        <div class="avatar">${esc(initialsOf(p.name))}</div>
        <div class="plate"><span class="nm">${esc(p.name)}${YOU && p.seat === YOU.seat ? " (you)" : ""}${p.connected ? "" : " · away"}</span><span class="st">${p.stack}</span></div>
        <div>${tags.join(" ")}</div>
      </div>`;
          if (p.committedStreet) {
            const bx = 50 + 21 * Math.cos(a);
            const by = 50 + 22 * Math.sin(a);
            html += `<div class="betchip" style="left:${bx.toFixed(1)}%;top:${by.toFixed(1)}%">${p.committedStreet}</div>`;
          }
          if (S.hand && p.seat === S.buttonSeat) {
            const dx = 50 + 29 * Math.cos(a - 0.5);
            const dy = 50 + 28 * Math.sin(a - 0.5);
            html += `<div class="dbtn" style="left:${dx.toFixed(1)}%;top:${dy.toFixed(1)}%">D</div>`;
          }
        });
        layer.innerHTML = html;
      }
      function logLines(street, log) {
        return (
          `<div><b style="color:var(--gold)">${esc(street)}</b></div>` +
          log
            .map(
              (e) =>
                `<div><b>${esc(e.name)}</b> ${esc(e.act)}${e.amt ? ` <span class="amt">${e.amt}</span>` : ""}${e.allIn ? " (all-in)" : ""}${e.short ? " — short, no reopen" : ""}</div>`
            )
            .join("")
        );
      }

      /* status + straddle toggle (straddle applies to the next hand, so it shows any time) */
      function renderIdle() {
        const el = $("t-idle");
        let html = "";
        if (S.config.straddleAllowed && me()) {
          html += `<button class="btn ghost" onclick='send({type:"straddle_next"})'>Toggle my straddle for next hand</button>`;
        }
        let status = "";
        if (YOU && YOU.seat < 0) {
          status =
            S.state === "idle"
              ? "You're in the room — waiting for the host to give you a seat."
              : "Hand in progress — the host can seat you for the next one.";
        } else if (S.state === "idle") {
          const ready = S.players.filter((p) => {
            return p.stack > 0;
          }).length;
          if (S.paused) status = "Game paused by the host.";
          else if (!S.hand)
            status = YOU && YOU.isHost ? "" : "Waiting for the host to deal the first hand.";
          else if (ready >= 2 && S.config.autoDeal !== false)
            status = "Shuffle up — next hand starting…";
          else if (!(YOU && YOU.isHost)) status = "Waiting for the host to start the next hand…";
        }
        if (status) html += `<p class="waiting" style="margin-top:10px">${status}</p>`;
        el.innerHTML = html;
      }

      /* action bar */
      function renderActionBar() {
        const bar = $("actionbar"),
          inner = $("actionbar-inner");
        const p = me();
        if (S.state !== "hand" || !p || p.folded || !p.inHand) {
          bar.style.display = "none";
          return;
        }
        bar.style.display = "block";
        const B = S.betting,
          myTurn = B && B.toActSeat === YOU.seat;
        if (!myTurn) {
          const who = S.players.find((q) => q.seat === (B && B.toActSeat));
          inner.innerHTML = `<div class="waiting">${who ? esc(who.name) + " to act" : "…"} · you have <b>${p.stack}</b> behind</div>`;
          return;
        }
        const owe = B.currentBet - p.committedStreet;
        const minTo = B.currentBet + B.lastFullRaiseSize;
        const canRaise = !p.acted && p.stack > owe;
        inner.innerHTML = `
    <div class="acts">
      <button class="btn red" onclick='act({type:"fold"})'>Fold</button>
      ${
        owe <= 0
          ? `<button class="btn" onclick='act({type:"check"})'>Check</button>`
          : `<button class="btn" onclick='act({type:"call"})'>Call ${Math.min(owe, p.stack)}</button>`
      }
      <button class="btn" onclick='act({type:"allin"})'>All-in ${p.stack}</button>
    </div>
    ${
      canRaise
        ? `
    <div class="raise-row">
      <input type="number" id="raise-to" inputmode="numeric" min="${minTo}" max="${p.committedStreet + p.stack}" value="${Math.min(minTo, p.committedStreet + p.stack)}">
      <button class="btn gold" onclick='act({type:"raise",to:+$("raise-to").value})'>${B.currentBet ? "Raise to" : "Bet"}</button>
    </div>
    <p class="dim" style="margin-top:6px">min ${B.currentBet ? "raise to" : "bet"} ${minTo} · max ${p.committedStreet + p.stack} (all-in)</p>`
        : p.acted && owe > 0
          ? `<p class="dim" style="margin-top:8px">Betting wasn't reopened — call or fold.</p>`
          : ""
    }
  `;
      }
      function act(a) {
        send({ type: "action", action: a });
      }

      /* showdown / payout */
      let pick = {};
      let ritSel = 1;
      function renderShowdown() {
        const el = $("t-showdown");
        if (S.state !== "showdown" || !S.pots) {
          el.innerHTML = "";
          pick = {};
          return;
        }
        ritSel = S.ritRuns || 1;
        const nameOf = (s) => {
          const p = S.players.find((q) => q.seat === s);
          return p ? p.name : "seat " + s;
        };
        if (!(YOU && YOU.isHost)) {
          el.innerHTML =
            S.pots
              .map(
                (p, i) => `<div class="potcard"><h4>${potName(i)} — <span>${p.amount}</span></h4>
      <div class="dim">eligible: ${p.eligible.map(nameOf).join(", ")}</div></div>`
              )
              .join("") + `<p class="waiting">Host awards the pots.</p>`;
          return;
        }
        const anyAllIn = S.players.some((p) => p.allIn && !p.folded);
        let html = "";
        if (S.config.ritAllowed && anyAllIn) {
          html +=
            `<div class="potcard"><h4>Runs</h4><div class="rungrid">` +
            [1, 2, 3, 4]
              .map(
                (n) =>
                  `<button class="wpick ${ritSel === n ? "sel" : ""}" onclick="setRuns(${n})">${n}×</button>`
              )
              .join("") +
            `</div><p class="dim" style="margin-top:6px">Running multiple boards needs everyone all-in to agree at the table.</p></div>`;
        }
        html += S.pots
          .map((p, i) => {
            let runs = "";
            for (let r = 0; r < ritSel; r++) {
              runs +=
                `<div class="runlabel">${ritSel > 1 ? `Run ${r + 1} winner(s)` : "Winner(s)"} — tap to select, tap two to split</div><div class="rungrid">` +
                p.eligible
                  .map((s) => {
                    const sel = (pick[i]?.[r] || []).includes(s);
                    return `<button class="wpick ${sel ? "sel" : ""}" onclick="togglePick(${i},${r},${s})">${esc(nameOf(s))}</button>`;
                  })
                  .join("") +
                `</div>`;
            }
            return `<div class="potcard"><h4>${potName(i)} — <span>${p.amount}</span></h4>${runs}</div>`;
          })
          .join("");
        const ready = S.pots.every((p, i) => {
          for (let r = 0; r < ritSel; r++) if (!(pick[i]?.[r] || []).length) return false;
          return true;
        });
        html += cbtn(
          "pay",
          "Pay the pots",
          "btn gold",
          () => {
            submitAwards();
          },
          ready ? "" : "disabled"
        );
        el.innerHTML = html;
      }
      function potName(i) {
        return i === 0 ? (S.pots.length > 1 ? "Main pot" : "Pot") : `Side pot ${i}`;
      }
      function setRuns(n) {
        ritSel = n;
        pick = {};
        send({ type: "set_rit", runs: n });
      }
      function togglePick(pot, run, seat) {
        pick[pot] = pick[pot] || {};
        const a = (pick[pot][run] = pick[pot][run] || []);
        const j = a.indexOf(seat);
        j >= 0 ? a.splice(j, 1) : a.push(seat);
        renderShowdown();
      }
      function submitAwards() {
        const awards = S.pots.map((p, i) => ({
          pot: i,
          runs: Array.from({ length: ritSel }, (_, r) => pick[i][r]),
        }));
        pick = {};
        send({ type: "award", awards });
      }

      /* ------------- two-tap confirm: first tap arms, second tap fires ------------- */
      const acts = {};
      let armed = null,
        armedTimer = null;
      function cbtn(key, label, cls, fn, extra = "") {
        acts[key] = fn;
        const isArmed = armed === key;
        return `<button class="${cls}${isArmed ? " armed" : ""}" ${extra} onclick="confirmAct('${key}')">${isArmed ? "Tap again to confirm" : label}</button>`;
      }
      function confirmAct(key) {
        clearTimeout(armedTimer);
        if (armed !== key) {
          armed = key;
          armedTimer = setTimeout(() => {
            armed = null;
            if (S) renderTable();
          }, 3500);
          if (S) renderTable();
          return;
        }
        armed = null;
        const fn = acts[key];
        if (fn) fn();
        if (S) renderTable();
      }
      /* swap panel contents without stomping what the host is typing */
      function setPanel(el, html) {
        const foc = document.activeElement;
        if (foc && el.contains(foc) && (foc.tagName === "INPUT" || foc.tagName === "SELECT"))
          return;
        const vals = {};
        for (const i of el.querySelectorAll("input,select")) if (i.id) vals[i.id] = i.value;
        el.innerHTML = html;
        for (const i of el.querySelectorAll("input,select")) {
          if (i.id && vals[i.id] !== undefined && vals[i.id] !== "") i.value = vals[i.id];
        }
      }

      /* ---------------- host drawer ---------------- */
      function toggleDrawer(on) {
        $("drawer").classList.toggle("on", on);
        if (on) renderDrawer();
      }
      function renderDrawer() {
        if (!S || !YOU || !YOU.isHost) return;
        const idle = S.state === "idle";
        let html = `<h3>Host controls</h3>`;
        html += `<p class="dim" style="margin-bottom:10px">Share to join: <b>${location.origin}/?g=${S.code}</b></p>`;
        if (idle) {
          html += cbtn(
            "deal",
            S.hand ? "Deal next hand now" : "Deal the first hand",
            "btn gold",
            () => {
              send({ type: "start_hand" });
              toggleDrawer(false);
            }
          );
        } else if (S.state === "hand") {
          const who = S.players.find((p) => {
            return p.seat === (S.betting ? S.betting.toActSeat : -1);
          });
          if (who) {
            html += cbtn(
              "ff-" + who.seat,
              `Force-fold ${esc(who.name)} (their turn)`,
              "btn red",
              () => {
                send({ type: "force_fold", seat: who.seat });
              }
            );
          }
        }
        html += S.paused
          ? cbtn(
              "resume",
              "Resume dealing",
              "btn",
              () => {
                send({ type: "set_pause", paused: false });
              },
              'style="margin-top:8px"'
            )
          : `<button class="btn ghost" style="margin-top:8px" onclick='send({type:"set_pause",paused:true})'>Pause dealing${idle ? "" : " after this hand"}</button>`;

        if (S.unseated && S.unseated.length) {
          const takenSeats = new Set(
            S.players.map((p) => {
              return p.seat;
            })
          );
          const freeSeats = [];
          for (let s = 0; s < 10; s++) if (!takenSeats.has(s)) freeSeats.push(s);
          html += `<h3 style="margin-top:18px">Waiting to sit</h3>`;
          for (const u of S.unseated) {
            const uid = u.id;
            const asked = u.buyIn > 0; // the player set their own buy-in; the host just approves
            html += `<div class="potcard">
          <div style="margin-bottom:6px"><b>${esc(u.name)}</b>${asked ? ` wants to buy in for <b style="color:var(--gold)">${u.buyIn}</b>` : ""}</div>
          <div class="row">
            ${asked ? "" : `<input id="buy-${uid}" type="number" inputmode="numeric" min="1" placeholder="Buy-in (they didn't set one)" oninput="syncDrawerButtons()" />`}
            <select id="seatsel-${uid}">${freeSeats
              .map((s) => {
                return `<option value="${s}">Seat ${s}</option>`;
              })
              .join("")}</select>
          </div>
          ${cbtn(
            "add-" + uid,
            asked ? `Accept ${esc(u.name)} for ${u.buyIn}` : "Add to the table",
            "btn gold",
            () => {
              const buy = asked ? undefined : Math.floor(+$("buy-" + uid).value);
              if (!asked && !(buy > 0)) return;
              send({ type: "seat_player", uid, buyIn: buy, seat: +$("seatsel-" + uid).value });
            },
            `id="addbtn-${uid}" style="margin-top:8px"${asked ? "" : " disabled"}`
          )}
        </div>`;
          }
          if (!idle)
            html += `<p class="dim">They take a seat now and are dealt in as soon as this hand ends.</p>`;

          const gone = S.players.filter((p) => {
            return !p.connected;
          });
          if (gone.length) {
            html += `<h3 style="margin-top:18px">Seat takeover</h3>
          <p class="dim">Hands a <b>disconnected</b> player's seat — stack and any live action — to someone waiting. Use it when a player lost their phone or storage.</p>`;
            for (const u of S.unseated) {
              const uid = u.id;
              html += `<div class="potcard"><div style="margin-bottom:6px"><b>${esc(u.name)}</b> takes over:</div>
            <select id="take-${uid}">${gone
              .map((p) => {
                return `<option value="${p.seat}">${esc(p.name)} — seat ${p.seat}, stack ${p.stack}</option>`;
              })
              .join("")}</select>
            ${cbtn(
              "takeover-" + uid,
              "Take over that seat",
              "btn",
              () => {
                send({ type: "assign_seat", uid, seat: +$("take-" + uid).value });
              },
              'style="margin-top:8px"'
            )}
          </div>`;
            }
          }
        }
        html +=
          `<hr class="split">` +
          cbtn(
            "end",
            "End game for everyone",
            "btn ghost",
            () => {
              send({ type: "end_game" });
            },
            'style="color:var(--danger)"'
          );
        setPanel($("drawer-panel"), html);
        syncDrawerButtons();
      }
      function syncDrawerButtons() {
        if (!S || !S.unseated) return;
        for (const u of S.unseated) {
          const inp = $("buy-" + u.id),
            btn = $("addbtn-" + u.id);
          if (inp && btn) btn.disabled = !(Math.floor(+inp.value) > 0);
        }
      }

      /* ---------------- per-player sheet (host taps a seat) ---------------- */
      let sheetSeat = null;
      function openSheet(seat) {
        if (!(YOU && YOU.isHost)) return;
        sheetSeat = seat;
        renderSheet();
        $("sheet").classList.add("on");
      }
      function closeSheet() {
        sheetSeat = null;
        $("sheet").classList.remove("on");
      }
      function renderSheet() {
        if (sheetSeat == null || !S) return;
        const p = S.players.find((q) => {
          return q.seat === sheetSeat;
        });
        if (!p) {
          closeSheet();
          return;
        }
        const self = YOU && p.seat === YOU.seat;
        const live = S.state !== "idle" && p.inHand;
        let html = `<h3>${esc(p.name)} — seat ${p.seat}</h3>
      <p class="dim" style="margin-bottom:10px">Stack ${p.stack}${
        p.pendingChips
          ? ` · ${p.pendingChips > 0 ? "+" : ""}${p.pendingChips} queued for after this hand`
          : ""
      }${p.connected ? "" : " · away"}</p>
      <div class="row">
        <input id="sheet-amt" type="number" inputmode="numeric" placeholder="e.g. 100 or -50" />
        ${cbtn("chips-" + p.seat, live ? "Add after this hand" : "Add chips", "btn", () => {
          const v = Math.floor(+$("sheet-amt").value);
          if (!v) return;
          send({ type: "add_chips", seat: p.seat, amount: v });
          if ($("sheet-amt")) $("sheet-amt").value = "";
        })}
      </div>`;
        if (S.state === "hand" && S.betting && S.betting.toActSeat === p.seat) {
          html += cbtn(
            "ff-" + p.seat,
            `Force-fold ${esc(p.name)}`,
            "btn red",
            () => {
              send({ type: "force_fold", seat: p.seat });
            },
            'style="margin-top:8px"'
          );
        }
        if (!self) {
          html += cbtn(
            "host-" + p.seat,
            `Make ${esc(p.name)} the host`,
            "btn",
            () => {
              send({ type: "transfer_host", seat: p.seat });
              closeSheet();
            },
            'style="margin-top:8px"'
          );
          html += cbtn(
            "rm-" + p.seat,
            `Remove ${esc(p.name)} (stack cashes out)`,
            "btn red",
            () => {
              send({ type: "remove_player", seat: p.seat });
              closeSheet();
            },
            'style="margin-top:8px"'
          );
        }
        html += `<button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Close</button>`;
        setPanel($("sheet-panel"), html);
      }
      function finalStandings(state) {
        try {
          return (
            "\n\nFinal stacks:\n" + state.players.map((p) => `${p.name}: ${p.stack}`).join("\n")
          );
        } catch {
          return "";
        }
      }

      /* ---------------- boot ---------------- */
      (function () {
        // name is never prefilled — joining under a name is a deliberate act
        const g = new URLSearchParams(location.search).get("g");
        if (g) {
          $("j-code").value = g.toUpperCase();
          // only auto-join if this device already holds a seat token (reconnect);
          // first-time visitors type a name and tap Join
          if (store.tok(g.toUpperCase())) joinRoom(g.toUpperCase());
        }
      })();
    </script>
  </body>
</html>
